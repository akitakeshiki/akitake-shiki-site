
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1E9D9">
  <title>書庫の管理室 | 秋茸梓樹</title>

  <style>
    :root {
      --cream: #F1E9D9;
      --brown: #8B7055;
      --green: #344A3C;
      --text: #3D382F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: "Yu Mincho", "Hiragino Mincho ProN",
        "Noto Serif JP", serif;
      line-height: 1.8;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #D8CCB9;
    }

    header a {
      color: var(--green);
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 20px 64px;
    }

    .eyebrow {
      color: var(--brown);
      letter-spacing: 0.15em;
      font-size: 0.8rem;
    }

    h1, h2 {
      color: var(--green);
    }

    .panel {
      background: #FAF6EE;
      border: 1px solid #D8CCB9;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
    }

    label {
      display: block;
      margin: 18px 0 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #BDAE98;
      border-radius: 4px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .check-label {
      display: flex;
      align-items: center;
      font-weight: normal;
    }

    button, .button {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 20px;
      border: 0;
      border-radius: 4px;
      background: var(--green);
      color: white;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: var(--brown);
    }

    .note {
      font-size: 0.9rem;
      color: #6A5B49;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: var(--brown);
      border-top: 1px solid #D8CCB9;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← 秋茸梓樹の書庫へ戻る</a>
  </header>

  <main>
    <p class="eyebrow">THE LIBRARY · ADMINISTRATION</p>
    <h1>書庫の管理室</h1>
    <p>ここから、新しい朗読作品を本棚に登録できます。</p>

    <section id="login-panel" class="panel">
      <h2>管理者ログイン</h2>
      <p>登録したGoogleアカウントでログインしてください。</p>
      <button id="login-button" type="button">
        Googleでログイン
      </button>
    </section>

    <section id="admin-panel" class="panel" hidden>
      <p>ログイン中：<strong id="user-email"></strong></p>
      <button id="logout-button" class="secondary" type="button">
        ログアウト
      </button>

      <h2>作品を登録する</h2>
      <p class="note">
        YouTubeの動画を公開してから登録してください。
        公開チェックを外すと、作品は本棚に表示されません。
      </p>

      <form id="work-form">
        <label for="title">作品名 *</label>
        <input id="title" name="title" required maxlength="200">

        <label for="category">ジャンル *</label>
        <select id="category" name="category" required>
          <option value="フリー台本朗読">フリー台本朗読</option>
          <option value="青空文庫・文学">青空文庫・文学</option>
          <option value="23時の声">23時の声</option>
        </select>

        <label for="youtube-url">YouTubeの動画URL *</label>
        <input
          id="youtube-url"
          name="youtube_url"
          type="url"
          placeholder="https://youtu.be/..."
          required
        >

       <label for="description">作品の紹介文</label>
<textarea
  id="description"
  name="description"
  placeholder="作品の雰囲気や、聴いてほしいポイントなど"
></textarea>

<div id="script-fields">
  <label for="script-author">台本の作者名</label>
  <input
    id="script-author"
    name="script_author"
    type="text"
    maxlength="200"
    placeholder="作者名"
  >

  <label for="script-url">台本URL</label>
  <input
    id="script-url"
    name="script_url"
    type="url"
    placeholder="https://..."
  >
</div>

<div id="aozora-fields">
  <label for="author-name">作者名</label>
  <input
    id="author-name"
    name="author_name"
    type="text"
    maxlength="200"
    placeholder="作者名"
  >

  <label for="aozora-url">青空文庫 図書カードURL</label>
  <input
    id="aozora-url"
    name="aozora_url"
    type="url"
    placeholder="https://www.aozora.gr.jp/..."
  >
</div>

        <label class="check-label">
          <input
            id="is-published"
            name="is_published"
            type="checkbox"
            checked
          >
          登録後すぐに本棚へ公開する
        </label>

        <button id="submit-button" type="submit">
          作品を登録する
        </button>
      </form>
    </section>
  
</section>

<section id="works-panel" class="panel" hidden>
  <h2>登録済みの作品</h2>
  <p class="note">
    登録済み作品の確認や、紹介文などの編集ができます。
  </p>
  <div id="works-list">
    <p>作品を読み込んでいます……</p>
  </div>
</section>

<p id="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    声と言葉が出会う場所 — 秋茸梓樹
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginPanel = document.getElementById("login-panel");
    const adminPanel = document.getElementById("admin-panel");
    const statusElement = document.getElementById("status");
    const loginButton = document.getElementById("login-button");
    const logoutButton = document.getElementById("logout-button");
    const submitButton = document.getElementById("submit-button");
    const workForm = document.getElementById("work-form");

    function showStatus(message) {
      statusElement.textContent = message;
    }

    
function showUser(user) {
  const loggedIn = Boolean(user);

  loginPanel.hidden = loggedIn;
  adminPanel.hidden = !loggedIn;

  const worksPanel = document.getElementById("works-panel");
  worksPanel.hidden = !loggedIn;

  if (user) {
    document.getElementById("user-email").textContent =
      user.email || "メールアドレス未取得";

    loadWorks();
  }
}

    loginButton.addEventListener("click", async () => {
      loginButton.disabled = true;
      showStatus("Googleログインへ移動します……");

      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.href.split("?")[0]
          }
        });

        if (error) throw error;
      } catch (error) {
        showStatus("ログインできませんでした：" + error.message);
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        showStatus("ログアウトできませんでした：" + error.message);
        return;
      }

      showUser(null);
      showStatus("ログアウトしました。");
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      showUser(session?.user || null);
    });

    async function initialize() {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        showStatus("ログイン状態を確認できませんでした。");
        return;
      }

      showUser(data.session?.user || null);
    }

async function loadWorks() {
  const worksPanel = document.getElementById("works-panel");
  const worksList = document.getElementById("works-list");

  worksPanel.hidden = false;
  worksList.replaceChildren();

  const loading = document.createElement("p");
  loading.textContent = "作品を読み込んでいます……";
  worksList.appendChild(loading);

  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError || !sessionData.session) {
    worksPanel.hidden = true;
    return;
  }

  const { data: works, error } = await supabaseClient
    .from("works")
    .select("id, title, category, description, youtube_url, script_author, script_url, author_name, aozora_url, thumbnail_url, is_published, sort_order")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });

  worksList.replaceChildren();

  if (error) {
    const message = document.createElement("p");
    message.textContent = "作品一覧を読み込めませんでした：" + error.message;
    worksList.appendChild(message);
    return;
  }

  if (!works || works.length === 0) {
    const message = document.createElement("p");
    message.textContent = "登録済みの作品はありません。";
    worksList.appendChild(message);
    return;
  }

  works.forEach((work) => {
    const item = document.createElement("article");
    item.style.borderTop = "1px solid #D8CCB9";
    item.style.padding = "16px 0";

    const title = document.createElement("h3");
    title.textContent = work.title;
    item.appendChild(title);

    const category = document.createElement("p");
    category.textContent = "ジャンル：" + work.category;
    item.appendChild(category);

    const status = document.createElement("p");
    status.textContent = work.is_published ? "公開中" : "非公開";
    item.appendChild(status);

    
const editButton = document.createElement("button");
editButton.type = "button";
editButton.textContent = "編集する";
editButton.addEventListener("click", () => {
  showEditForm(work);
});
item.appendChild(editButton);

const deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "削除する";
deleteButton.className = "secondary";
deleteButton.style.marginLeft = "8px";

deleteButton.addEventListener("click", async () => {
  const confirmed = window.confirm(
    `「${work.title}」を削除しますか？\n\nこの操作は取り消せません。`
  );

  if (!confirmed) return;

  deleteButton.disabled = true;
  showStatus("作品を削除しています……");

  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      throw new Error("ログインし直してください。");
    }

    const { error } = await supabaseClient
      .from("works")
      .delete()
      .eq("id", work.id);

    if (error) throw error;

    showStatus(`「${work.title}」を削除しました。`);
    await loadWorks();
  } catch (error) {
    showStatus("削除できませんでした：" + error.message);
    deleteButton.disabled = false;
  }
});

item.appendChild(deleteButton);

// 公開・非公開を切り替えるボタン
const publishButton = document.createElement("button");
publishButton.type = "button";
publishButton.textContent = work.is_published
  ? "非公開にする"
  : "公開する";
publishButton.className = "secondary";
publishButton.style.marginLeft = "8px";

publishButton.addEventListener("click", async () => {
  publishButton.disabled = true;
  showStatus(
    work.is_published
      ? `「${work.title}」を非公開にしています……`
      : `「${work.title}」を公開しています……`
  );

  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      throw new Error("ログインし直してください。");
    }

    const { error } = await supabaseClient
      .from("works")
      .update({
        is_published: !work.is_published
      })
      .eq("id", work.id);

    if (error) throw error;

    showStatus(
      work.is_published
        ? `「${work.title}」を非公開にしました。`
        : `「${work.title}」を公開しました。`
    );

    await loadWorks();
  } catch (error) {
    showStatus("公開状態を変更できませんでした：" + error.message);
    publishButton.disabled = false;
  }
});

item.appendChild(publishButton);

worksList.appendChild(item);
  });
}
    
function showEditForm(work) {
  const worksList = document.getElementById("works-list");

  // すでに開いている編集フォームがあれば閉じる
  const oldForm = document.getElementById("edit-form");
  if (oldForm) oldForm.remove();

  const form = document.createElement("form");
  form.id = "edit-form";
  form.className = "panel";

  const heading = document.createElement("h3");
  heading.textContent = "作品を編集する";
  form.appendChild(heading);

  function addField(labelText, name, value, type = "text") {
    const label = document.createElement("label");
    label.textContent = labelText;

    const input = document.createElement("input");
    input.name = name;
    input.type = type;
    input.value = value ?? "";
    input.required = name === "title" ||
                     name === "youtube_url";

    label.htmlFor = "edit-" + name;
    input.id = "edit-" + name;

    label.appendChild(input);
    form.appendChild(label);

    return input;
  }

  const titleInput = addField("作品名", "title", work.title);

  const categoryLabel = document.createElement("label");
  categoryLabel.textContent = "ジャンル";

  const categorySelect = document.createElement("select");
  categorySelect.name = "category";

  [
    "フリー台本朗読",
    "青空文庫・文学",
    "23時の声"
  ].forEach((category) => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    option.selected = category === work.category;
    categorySelect.appendChild(option);
  });

  categoryLabel.appendChild(categorySelect);
  form.appendChild(categoryLabel);

  const urlInput = addField(
    "YouTubeの動画URL",
    "youtube_url",
    work.youtube_url,
    "url"
  );

  const descriptionLabel = document.createElement("label");
  descriptionLabel.textContent = "作品の紹介文";

  const descriptionInput = document.createElement("textarea");
  descriptionInput.name = "description";
  descriptionInput.value = work.description || "";
  descriptionLabel.appendChild(descriptionInput);
  form.appendChild(descriptionLabel);

  const scriptAuthorInput = addField(
  "台本の作者名",
  "script_author",
  work.script_author || ""
);

const scriptUrlInput = addField(
  "台本URL",
  "script_url",
  work.script_url || "",
  "url"
);

  const authorNameInput = addField(
  "作者名",
  "author_name",
  work.author_name || ""
);

const aozoraUrlInput = addField(
  "青空文庫 図書カードURL",
  "aozora_url",
  work.aozora_url || "",
  "url"
);

  const thumbnailInput = addField(
    "サムネイル画像URL",
    "thumbnail_url",
    work.thumbnail_url || "",
    "url"
  );

  const orderInput = addField(
    "表示順",
    "sort_order",
    work.sort_order,
    "number"
  );
  orderInput.step = "1";

  const publishedLabel = document.createElement("label");
  publishedLabel.className = "check-label";

  const publishedInput = document.createElement("input");
  publishedInput.type = "checkbox";
  publishedInput.name = "is_published";
  publishedInput.checked = work.is_published;

  publishedLabel.appendChild(publishedInput);
  publishedLabel.append(" 公開する");
  form.appendChild(publishedLabel);

  const saveButton = document.createElement("button");
  saveButton.type = "submit";
  saveButton.textContent = "変更を保存する";
  form.appendChild(saveButton);

  const cancelButton = document.createElement("button");
  cancelButton.type = "button";
  cancelButton.className = "secondary";
  cancelButton.textContent = "キャンセル";
  cancelButton.addEventListener("click", () => form.remove());
  form.appendChild(cancelButton);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    saveButton.disabled = true;
    showStatus("変更を保存しています……");

    try {
      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError || !sessionData.session) {
        throw new Error("ログインし直してください。");
      }

      const youtubeUrl = urlInput.value.trim();
      const parsedUrl = new URL(youtubeUrl);

const videoId =
  parsedUrl.hostname === "youtu.be"
    ? parsedUrl.pathname.slice(1)
    : parsedUrl.pathname.startsWith("/shorts/")
      ? parsedUrl.pathname.split("/")[2]
      : parsedUrl.searchParams.get("v");

const autoThumbnailUrl = videoId
  ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
  : "";
      
      if (
        !["youtube.com", "www.youtube.com", "youtu.be",
          "m.youtube.com"].includes(parsedUrl.hostname)
      ) {
        throw new Error("YouTubeの動画URLを入力してください。");
      }

      const sortOrder = Number(orderInput.value);

      if (!Number.isSafeInteger(sortOrder)) {
        throw new Error("表示順には整数を入力してください。");
      }

      const { error } = await supabaseClient
        .from("works")
        .update({
  title: titleInput.value.trim(),
  category: categorySelect.value,
  youtube_url: youtubeUrl,
  description: descriptionInput.value.trim() || null,
  script_author: scriptAuthorInput.value.trim() || null,
  script_url: scriptUrlInput.value.trim() || null,
          author_name: authorNameInput.value.trim() || null,
aozora_url: aozoraUrlInput.value.trim() || null,
  thumbnail_url: thumbnailInput.value.trim() || null,
          sort_order: sortOrder,
          is_published: publishedInput.checked
        })
        .eq("id", work.id);

      if (error) throw error;

      showStatus("変更を保存しました！");
      form.remove();
      await loadWorks();
    } catch (error) {
      showStatus("保存できませんでした：" + error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  worksList.prepend(form);
  form.scrollIntoView({ behavior: "smooth", block: "start" });
}
    workForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      showStatus("作品を登録しています……");

      try {
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          showUser(null);
          throw new Error("ログインし直してください。");
        }

        const title = document.getElementById("title").value.trim();
        const category = document.getElementById("category").value;
        const youtubeUrl =
          document.getElementById("youtube-url").value.trim();
        const description =
          document.getElementById("description").value.trim();
        const scriptAuthor =
  document.getElementById("script-author").value.trim();
        const authorName =
  document.getElementById("author-name").value.trim();
const aozoraUrl =
  document.getElementById("aozora-url").value.trim();
const scriptUrl =
  document.getElementById("script-url").value.trim();
       const { data: maxSortData, error: maxSortError } =
  await supabaseClient
    .from("works")
    .select("sort_order")
    .order("sort_order", { ascending: false })
    .limit(1);

if (maxSortError) throw maxSortError;

const sortOrder =
  maxSortData && maxSortData.length > 0
    ? maxSortData[0].sort_order + 1
    : 1;
        const isPublished =
          document.getElementById("is-published").checked;

        const parsedUrl = new URL(youtubeUrl);
        
        const videoId =
  parsedUrl.hostname === "youtu.be"
    ? parsedUrl.pathname.slice(1)
    : parsedUrl.searchParams.get("v");

const autoThumbnailUrl = videoId
  ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
  : "";

        if (
          !["youtube.com", "www.youtube.com", "youtu.be",
            "m.youtube.com"].includes(parsedUrl.hostname)
        ) {
          throw new Error("YouTubeの動画URLを入力してください。");
        }

        if (!Number.isSafeInteger(sortOrder)) {
          throw new Error("表示順には整数を入力してください。");
        }

        const { error } = await supabaseClient
  .from("works")
  .insert({
  title,
  category,
  youtube_url: youtubeUrl,
  description: description || null,
  script_author: scriptAuthor || null,
  script_url: scriptUrl || null,
    author_name: authorName || null,
aozora_url: aozoraUrl || null,
  thumbnail_url: autoThumbnailUrl || null,
  sort_order: sortOrder,
  is_published: isPublished
});

        if (error) throw error;

        showStatus(
          isPublished
            ? "登録しました！公開サイトの本棚を確認してみてください。"
            : "下書きとして登録しました。公開するにはSupabaseで設定を変更してください。"
        );

        workForm.reset();
        document.getElementById("sort-order").value = "0";
        document.getElementById("is-published").checked = true;
      } catch (error) {
        showStatus("登録できませんでした：" + error.message);
            } finally {
        submitButton.disabled = false;
      }
    });

    const categorySelect = document.getElementById("category");
    const aozoraFields = document.getElementById("aozora-fields");

  function updateAozoraFields() {
  const category = categorySelect.value;

  if (category === "フリー台本朗読") {
    aozoraFields.hidden = true;
    document.getElementById("script-fields").hidden = false;
  } else if (category === "青空文庫・文学") {
    aozoraFields.hidden = false;
    document.getElementById("script-fields").hidden = true;
  } else {
    aozoraFields.hidden = false;
    document.getElementById("script-fields").hidden = false;
  }
}

    categorySelect.addEventListener("change", updateAozoraFields);
    updateAozoraFields();

    initialize();
  </script>
</body>
</html>
