
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F1E9D9">
  <title>作品詳細 | 秋茸梓樹の書庫</title>
  <style>
    :root {
      --cream: #F1E9D9;
      --brown: #8B7055;
      --green: #344A3C;
      --text: #3D382F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family:
        "Yu Mincho", "Hiragino Mincho ProN",
        "Noto Serif JP", serif;
      line-height: 1.9;
    }

    a {
      color: var(--green);
    }

    header {
      padding: 24px 20px;
      border-bottom: 1px solid #D8CCB9;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .site-name {
      color: var(--green);
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    .eyebrow {
      color: var(--brown);
      letter-spacing: 0.15em;
      font-size: 0.8rem;
    }

    h1 {
      color: var(--green);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.5;
      margin: 12px 0;
    }

    .category {
      display: inline-block;
      border: 1px solid var(--brown);
      border-radius: 999px;
      padding: 2px 14px;
      color: var(--brown);
      font-size: 0.85rem;
    }

    .thumbnail {
      width: 100%;
      display: block;
      margin: 32px 0;
      border-radius: 6px;
    }

    .description {
      white-space: pre-wrap;
      margin: 28px 0;
    }

    .script-info {
  margin: 40px 0 0;
  padding: 24px 0;
  border-top: 1px solid #D8CCB9;
  border-bottom: 1px solid #D8CCB9;
}

.script-info h2 {
  margin: 0 0 10px;
  color: var(--green);
  font-size: 1rem;
  font-weight: bold;
  letter-spacing: 0.08em;
}

.script-info p {
  margin: 0 0 12px;
  color: var(--text);
  font-size: 0.9rem;
}

.script-info a {
  color: var(--green);
  font-size: 0.9rem;
  text-decoration: underline;
  text-underline-offset: 4px;
}

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .button {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 4px;
      background: var(--green);
      color: white;
      text-decoration: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
    }

    .message {
      padding: 24px;
      background: #E7DDCB;
      border-radius: 6px;
    }

    footer {
      padding: 24px;
      text-align: center;
      border-top: 1px solid #D8CCB9;
      color: var(--brown);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="site-name" href="index.html">
        秋茸梓樹の書庫
      </a>
      <a href="index.html#works">本棚へ戻る</a>
    </div>
  </header>

  <main>
    <p class="eyebrow">THE LIBRARY OF VOICE</p>
    <div id="work-content" class="message" aria-live="polite">
      作品を読み込んでいます……
    </div>
    <a class="back-link" href="index.html#works">
      ← 本棚へ戻る
    </a>
  </main>

  <footer>
    声と言葉が出会う場所 — 秋茸梓樹
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadWork() {
      const content = document.getElementById("work-content");
      const params = new URLSearchParams(window.location.search);
      const workId = params.get("id");

      if (!workId || !/^\d+$/.test(workId)) {
        content.textContent = "作品が指定されていません。本棚から作品を選んでください。";
        return;
      }

      const { data: work, error } = await supabaseClient
        .from("works")
        .select("id, title, category, description, thumbnail_url, youtube_url, script_author, script_url")
        .eq("id", workId)
        .eq("is_published", true)
        .maybeSingle();

      if (error || !work) {
        content.textContent = "作品が見つかりませんでした。本棚に戻って、もう一度お選びください。";
        return;
      }

      content.className = "";
      content.replaceChildren();

      const category = document.createElement("span");
      category.className = "category";
      category.textContent = work.category;
      content.appendChild(category);

      const title = document.createElement("h1");
      title.textContent = work.title;
      content.appendChild(title);

      if (work.thumbnail_url) {
        const img = document.createElement("img");
        img.className = "thumbnail";
        img.src = work.thumbnail_url;
        img.alt = work.title + "のサムネイル";
        content.appendChild(img);
      }

      const description = document.createElement("p");
      description.className = "description";
      description.textContent =
        work.description || "この作品の紹介文は、現在準備中です。";
      content.appendChild(description);

      if (work.script_author || work.script_url) {
  const scriptInfo = document.createElement("div");
  scriptInfo.className = "script-info";

  const heading = document.createElement("h2");
  heading.textContent = "台本について";
  scriptInfo.appendChild(heading);

  if (work.script_author) {
    const author = document.createElement("p");
    author.textContent = "作者：" + work.script_author;
    scriptInfo.appendChild(author);
  }

  if (work.script_url) {
    const scriptLink = document.createElement("a");
    scriptLink.href = work.script_url;
    scriptLink.target = "_blank";
    scriptLink.rel = "noopener noreferrer";
    scriptLink.textContent = "台本を読む →";
    scriptInfo.appendChild(scriptLink);
  }

  content.appendChild(scriptInfo);
}

      const actions = document.createElement("div");
      actions.className = "actions";

      const listenLink = document.createElement("a");
      listenLink.className = "button";
      listenLink.href = work.youtube_url;
      listenLink.target = "_blank";
      listenLink.rel = "noopener noreferrer";
      listenLink.textContent = "YouTubeで作品を聴く";
      actions.appendChild(listenLink);

      content.appendChild(actions);
      document.title = work.title + " | 秋茸梓樹の書庫";
    }

    loadWork();
  </script>
</body>
</html>
